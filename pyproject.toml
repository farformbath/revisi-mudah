[project]
name = "revisi-mudah"
version = "0.1.0"
description = "Revisi Mudah — Dari rekaman bimbingan menjadi rencana revisi yang terstruktur."
readme = "README.md"
authors = [
    { name = "farformbath", email = "67770352+farformbath@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "av<14",
    "faster-whisper>=1.2.1",
    "jsonschema>=4.20.0",
    "mcp>=1.0.0",
    "mutagen>=1.48.1",
    "pydantic>=2.7.0",
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "typer>=0.12.0",
]

[project.scripts]
revisi-mudah = "revisi_mudah.cli:main"
revisi-mudah-mcp = "revisi_mudah.mcp.server:main"
mentorspec = "revisi_mudah.cli:main"
mentorspec-mcp = "revisi_mudah.mcp.server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["B008"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
